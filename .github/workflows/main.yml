name: Linkvertise Automation Continuous

on:
  # Trigger when previous workflow completes - creates infinite loop
  workflow_run:
    workflows: ["Linkvertise Automation Continuous"]
    types: [completed]
  
  # Manual start
  workflow_dispatch:

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    concurrency:
      group: automation
      cancel-in-progress: false

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install --production

      - name: 🎬 Run automation (Attempt 1)
        id: run1
        run: npm start
        timeout-minutes: 5
        continue-on-error: true

      - name: ⏳ Wait before next cycle
        run: sleep 120  # Wait 2 minutes before next check

      - name: 🎬 Run automation (Attempt 2)
        if: steps.run1.outcome == 'failure'
        id: run2
        run: npm start
        timeout-minutes: 5
        continue-on-error: true

      - name: 📊 Log results
        if: always()
        run: |
          echo "Run 1 Status: ${{ steps.run1.outcome }}"
          echo "Run 2 Status: ${{ steps.run2.outcome }}"
          echo "Completed at: $(date)"

      - name: 🔄 Trigger next cycle
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const response = await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'automation-continuous.yml',
                ref: context.ref
              });
              console.log('Next cycle triggered:', response.status);
            } catch (error) {
              console.log('Failed to trigger next cycle:', error.message);
            }
        continue-on-error: true
