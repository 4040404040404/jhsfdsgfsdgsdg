name: Linkvertise Automation Loop

on:
  # Run on schedule every 30 minutes
  schedule:
    - cron: '*/30 * * * *'
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Trigger when workflow completes (creates continuous loop)
  workflow_run:
    workflows: ["Linkvertise Automation Loop"]
    types: [completed]

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    permissions:
      contents: read
      actions: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🎬 Run automation script
        run: npm start
        timeout-minutes: 5
        continue-on-error: true

      - name: 📝 Log completion
        run: |
          echo "Automation job completed at $(date)"
          echo "Next run will be triggered automatically in 30 minutes"

      - name: 🔄 Trigger next run (Self-trigger for continuous loop)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'automation.yml',
              ref: context.ref
            });
        continue-on-error: true

  notify:
    runs-on: ubuntu-latest
    needs: automate
    if: always()
    
    steps:
      - name: ✅ Workflow summary
        run: |
          echo "==================================="
          echo "Automation job finished"
          echo "Status: ${{ needs.automate.result }}"
          echo "==================================="
